<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Room | DesignNest</title>

    <style>
        body {
            margin: 0;
            background: #f5f1eb;
            color: #302d29;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,.07);
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #837c74;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: 600;
            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ddd3ca;
            border-radius: 10px;
            font-size: 14px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .dimensions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #a9684d;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #8f543d;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #6c625a;
            text-decoration: none;
        }

        @media(max-width:600px) {
            .dimensions {
                grid-template-columns: 1fr;
            }

            .container {
                margin: 20px auto;
            }

            .card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Add Room</h1>

        <p class="subtitle">
            Add room details for <strong>{{ project.name }}</strong>
        </p>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <label>Room Name</label>

            <input
                type="text"
                name="name"
                placeholder="Example: Living Room"
                required
            >

            <label>Room Dimensions</label>

            <div class="dimensions">

                <input
                    type="number"
                    step="0.01"
                    name="length"
                    placeholder="Length"
                >

                <input
                    type="number"
                    step="0.01"
                    name="width"
                    placeholder="Width"
                >

                <input
                    type="number"
                    step="0.01"
                    name="height"
                    placeholder="Height"
                >

            </div>

            <label>Room Requirements</label>

            <textarea
                name="requirements"
                placeholder="Describe what you want in this room..."
            ></textarea>

            <label>Room Photo</label>

            <input
                type="file"
                name="image"
                accept="image/*"
            >

            <button type="submit">
                Add Room
            </button>

        </form>

        <a
            href="{% url 'room_details' project.id %}"
            class="back"
        >
            ← Back to Room Details
        </a>

    </div>

</div>

</body>
</html>
